<!-- =======================================================
     NAVBAR
======================================================== -->

<nav class="navbar">

  <div class="navbar-container">

    <!-- ===================================================
         LOGO
    ==================================================== -->

    <a
      class="brand"
      href="#inicio"
      aria-label="AS-BUILT - Inicio"
    >

      <span class="brand-cube"></span>

      <span class="wordmark">
        AS-<span>BUILT</span>
      </span>

    </a>


    <!-- ===================================================
         MENU
    ==================================================== -->

    <div
      class="navbar-menu"
      [class.mobile-open]="menuMobileAbierto"
    >

      <!-- INICIO -->

      <a
        href="#inicio"
        class="nav-link"
        data-section="inicio"
        (click)="cerrarMenuMobile()"
      >
        Inicio
      </a>


      <!-- SERVICIOS -->

      <a
        href="#servicios"
        class="nav-link"
        data-section="servicios"
        (click)="cerrarMenuMobile()"
      >
        Servicios
      </a>


      <!-- PROYECTOS -->

      <a
        href="#proyectos"
        class="nav-link"
        data-section="proyectos"
        (click)="cerrarMenuMobile()"
      >
        Proyectos
      </a>


      <!-- CAPACIDAD -->

      <a
        href="#capacidad"
        class="nav-link"
        data-section="capacidad"
        (click)="cerrarMenuMobile()"
      >
        Capacidad
      </a>


      <!-- NOSOTROS -->

      <a
        href="#nosotros"
        class="nav-link"
        data-section="nosotros"
        (click)="cerrarMenuMobile()"
      >
        Nosotros
      </a>


      <!-- =================================================
           COTIZACIÓN MOBILE
      ================================================== -->

      <div class="mobile-menu-actions">

        <a
          routerLink="/solicitar-demo"
          class="hero-button primary"
          (click)="cerrarMenuMobile()"
        >

          Solicitar cotización

          <i class="fas fa-arrow-right"></i>

        </a>

      </div>

    </div>


    <!-- ===================================================
         ACTIONS DESKTOP
    ==================================================== -->

    <div class="navbar-actions">

      <!-- INGRESAR -->

      <a
        routerLink="/login"
        class="btn-login"
      >
        Ingresar
      </a>


      <!-- COTIZACIÓN -->

      <a
        routerLink="/solicitar-demo"
        class="hero-button primary"
      >

        Solicitar cotización

        <i class="fas fa-arrow-right"></i>

      </a>

    </div>


    <!-- ===================================================
         INGRESAR MOBILE
    ==================================================== -->

    <a
      routerLink="/login"
      class="btn-login-mobile"
    >
      Ingresar
    </a>


    <!-- ===================================================
         MOBILE MENU BUTTON
    ==================================================== -->

    <button
      class="mobile-menu-button"
      type="button"
      aria-label="Abrir menú"
      [attr.aria-expanded]="menuMobileAbierto"
      (click)="toggleMenuMobile()"
    >

      <i
        class="fas"
        [ngClass]="menuMobileAbierto ? 'fa-times' : 'fa-bars'"
      ></i>

    </button>

  </div>

</nav>


<!-- =======================================================
     SCROLL PROGRESS
======================================================== -->

<div class="scroll-progress">

  <div class="scroll-progress-bar"></div>

</div>
